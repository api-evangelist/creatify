openapi: 3.2.0
info:
  title: Creatify AI Editing API
  description: The Creatify API generates AI avatar and marketing videos programmatically.
  version: '1.0'
  contact:
    name: Creatify
    url: https://creatify.ai
servers:
- url: https://api.creatify.ai/api
  description: Creatify API
security:
- apiId: []
  apiKey: []
tags:
- name: AI Editing
  description: Enhance and stylize existing videos (modeled).
paths:
  /ai_editing/:
    post:
      operationId: createAiEditing
      tags:
      - AI Editing
      summary: Create an AI editing job
      description: Enhance and stylize an existing video with professional templates. Async - poll GET /ai_editing/{id}/.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The created AI editing job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /ai_editing/{id}/:
    get:
      operationId: getAiEditing
      tags:
      - AI Editing
      summary: Get an AI editing job
      x-modeled: true
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The AI editing job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: The UUID of the resource.
      schema:
        type: string
        format: uuid
  schemas:
    VideoJob:
      type: object
      description: A generic asynchronous video-generation job.
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - in_queue
          - running
          - done
          - error
        progress:
          type: string
        failed_reason:
          type:
          - string
          - 'null'
        credits_used:
          type: number
        duration:
          type: integer
        video_output:
          type:
          - string
          - 'null'
          format: uri
        video_thumbnail:
          type:
          - string
          - 'null'
          format: uri
        output:
          type:
          - string
          - 'null'
          format: uri
        aspect_ratio:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid X-API-ID / X-API-KEY headers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    apiId:
      type: apiKey
      in: header
      name: X-API-ID
      description: Your unique Creatify API identifier from the in-app API Dashboard.
    apiKey:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Your secret Creatify API key. Keep it server-side.
